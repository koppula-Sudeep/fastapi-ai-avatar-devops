
apiVersion: v1
kind: Pod

metadata:
  name: ai-avatar-pod
  labels:
    app: ai-avatar

spec:
  containers:
    - name: ai-avatar-container
      image: ai-avatar-intro:1.0
      imagePullPolicy: Never

      ports:
        - containerPort: 8000

      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 20
